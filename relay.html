<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>移動中…</title>
<style>
html,body{margin:0;width:100%;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#fff;color:#111}
.wrap{box-sizing:border-box;width:min(88%,520px);margin:0 auto;padding:64px 0 40px;text-align:center}
.msg{font-size:16px;line-height:1.7;margin-bottom:20px}
.btn{display:none;box-sizing:border-box;width:100%;padding:14px 16px;border-radius:14px;background:#111;color:#fff;font-size:16px;font-weight:700;text-decoration:none}
.note{margin-top:16px;font-size:13px;color:#666;line-height:1.6}
.arrow{font-size:28px;line-height:1;margin-bottom:8px;text-align:right}
</style>
</head>
<body>
<div class="wrap">
  <div id="iosFallback" style="display:none">
    <div class="msg">外部ブラウザで開きます。<br>自動で切り替わらない場合は下のボタンをタップしてください。</div>
    <a class="btn" id="safariBtn" href="#">Safariで開く</a>
  </div>
  <div id="androidGuide" style="display:none">
    <div class="arrow">︙↗</div>
    <div class="msg">右上の「︙」をタップして<br>「Chromeブラウザで開く」から見てね。</div>
    <a class="btn" id="chromeBtn" href="#">Chromeで開く</a>
    <div class="note">ボタンで開けない場合は、メニューから「Chromeブラウザで開く」を選んでください。</div>
  </div>
  <div id="plain" style="display:none">
    <div class="msg">移動中です…</div>
    <a class="btn" id="directBtn" href="#">そのまま開く</a>
  </div>
</div>

<script>
(() => {
  const params = new URLSearchParams(location.search);
  let to = params.get("to") || "https://aishugyo.com/";
  if (!/^https:\/\//i.test(to)) to = "https://aishugyo.com/";

  const ua = navigator.userAgent || "";
  const android = /Android/i.test(ua);
  const ios = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

  function iosMajor() {
    const m = ua.match(/OS (\d+)[_.]/i);
    return m ? parseInt(m[1], 10) : null;
  }

  if (ios) {
    const safariUrl = "x-safari-" + to;
    const btn = document.getElementById("safariBtn");
    btn.href = safariUrl;
    btn.style.display = "block";
    const major = iosMajor();
    if (major !== null && major >= 17) {
      document.getElementById("iosFallback").style.display = "block";
      setTimeout(() => { window.location.href = safariUrl; }, 120);
    } else {
      window.location.replace(to);
    }
    return;
  }

  if (android) {
    document.getElementById("androidGuide").style.display = "block";
    const btn = document.getElementById("chromeBtn");
    btn.href = "intent://" + to.replace(/^https:\/\//i, "") + "#Intent;scheme=https;package=com.android.chrome;end";
    btn.style.display = "block";
    return;
  }

  document.getElementById("plain").style.display = "block";
  const d = document.getElementById("directBtn");
  d.href = to;
  d.style.display = "block";
  window.location.replace(to);
})();
</script>
</body>
</html>
